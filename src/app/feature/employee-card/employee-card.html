<article class="card">
  <a
    class="zone-compact"
    routerLink="/employee/{{ employee().id }}"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
  >
    <div>
      <h3 class="card__name">{{ employee().firstName }} {{ employee().lastName }}</h3>
      <p class="card__job">{{ employee().job }}</p>
    </div>
    <app-employee-badge
      [initiales]="employee().firstName.substring(0, 1) + employee().lastName.substring(0, 1)"
    ></app-employee-badge>
  </a>
  @if (!compact()) {
    <p>{{ employee().department }}</p>
    <!-- Liaison de propriete : l'adresse du lien est construite a partir des donnees. -->
    <a [href]="'mailto:' + employee().email">{{ employee().email }}</a>
    <app-status-badge [remote]="employee().remote" />
  }
</article>
