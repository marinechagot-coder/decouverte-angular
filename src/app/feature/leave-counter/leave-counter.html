<h2 id="leave-title">Mes congés</h2>
<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Solde</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Jours posés : {{ daysTaken() }}</p>
    <!-- aria-live : le lecteur d'ecran annonce le nouveau solde. -->
    @if (isEmpty()) {
      <p aria-live="polite" class="counter--empty">
        Jours restants : {{ remainingDays() }} / {{ totalDays }} &#128557;
      </p>
    } @else {
      <p aria-live="polite">Jours restants : {{ remainingDays() }} / {{ totalDays }}</p>
    }

    <p>Vous avez utilisé {{ pourConges() }} % de vos congés</p>
    <div class="counter__actions">
      <button matButton="filled" type="button" [disabled]="isEmpty()" (click)="addDay()">
        Poser un jour
      </button>

      <button
        matButton="outlined"
        type="button"
        [disabled]="daysTaken() > totalDays - 5"
        (click)="addWeek()"
      >
        Poser une semaine
      </button>
      <button
        matButton="outlined"
        type="button"
        [disabled]="daysTaken() === 0"
        (click)="removeDay()"
      >
        Annuler un jour
      </button>
      <button matButton="outlined" type="button" (click)="reset()">Remettre à zéro</button>
    </div>
  </mat-card-content>
</mat-card>
